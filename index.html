<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SmartDisplayUI</title>
    <link type="text/css" rel="stylesheet" href="style.css">
</head>
<body>






    <div data-page="home">
        <div class="top-left">
            左上
        </div>

        <div class="top-right">
            右上
        </div>

        <div class="bottom-left">
            左下
        </div>

        <div class="bottom-right">
            右下
        </div>
    </div>


    <div data-page="weather">
        <div class="left">
            左
        </div>

        <div class="right">
            右
        </div>
    </div>

    <div data-page="calendar">
        カレンダー
    </div>

    <div data-page="news">
        ニュース
    </div>
    
    <div data-page="web">
        ウェブ
    </div>
    
    <div data-page="tool">
        ツール
    </div>

    <div class="bottom">
        <button data-page-target="home">ホーム</button>
        <button data-page-target="weather">天気</button>
        <button data-page-target="calendar">カレンダー</button>
        <button data-page-target="news">ニュース</button>
        <button data-page-target="web">ウェブ</button>
        <button data-page-target="tool">ツール</button>
    </div>
    
    <script src="js/pages.js"></script>
</body>
</html>
